<!-- Modal Editar Cliente -->
<div class="modal fade" id="editarClienteModal" tabindex="-1" aria-labelledby="editarClienteModalLabel" data-bs-backdrop="static" aria-hidden="true">   
    <form action="editarCliente" method="POST">
        {% csrf_token %}
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="editarClienteModal">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input id="id" name="id" hidden>

                    <label for="nombre" style="font-weight: bold">Nombre:</label>
                    <input id="nombre" name="nombre" required>

                    <label for="cuit" style="font-weight: bold">CUIT:</label>
                    <input id="cuit" name="cuit">

                    <label for="condicion_iva" style="font-weight: bold">Condición frente al IVA:</label>
                    <select name="condicion_iva" id="condicion_iva" class="form-control select">
                        <option value="">Sin especificar</option>
                        {% for valor, etiqueta in CondicionesIva %}
                            <option value="{{ valor }}">{{ etiqueta }}</option>
                        {% endfor %}
                    </select>

                    <label for="negocio" style="font-weight: bold">Negocio:</label>
                    <input type="text" id="negocio" name="negocio" required> 
                    <label for="met_contacto" style="font-weight: bold">Método de contacto:</label>
                    <select name="met_contacto" id="met_contacto" class="form-control select" placeholder="Elige una opción" required>
                        <option value="">Elige una opción</option>
                        {% for valor, etiqueta in Categorias %}
                            <option value="{{ valor }}">{{ etiqueta }}</option>
                        {% endfor %}
                    </select>
                
                    <label for="telefono" style="font-weight: bold">Teléfono:</label>
                    <input type="text" id="telefono" name="telefono"> 

                    <label for="direccion" style="font-weight: bold">Dirección:</label>
                    <input type="text" id="direccion" name="direccion"> 
                
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark btn-xs btn-fuente" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-dark btn-xs btn-fuente">Guardar cambios</a></button> 
                </div>
            </div>
        </div>
    </form>
</div>

<!-- Modal Ficha Cliente -->
<div class="modal fade" id="modalFichaCliente" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="fichaClienteNombre"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" style="max-height: 75vh; overflow-y: auto; font-size: 0.9rem;">

        <!-- Datos del cliente -->
        <div class="mb-4">
          <h6 class="fw-bold mb-3 border-bottom pb-1">Datos</h5>
            <div class="row g-2">
            <div class="col-md-6">
                <strong>Teléfono:</strong>
                <span id="fichaTelefono"></span>
                <a id="fichaWapp" href="#" target="_blank" class="btn btn-dark btn-xs ms-1" title="WhatsApp" style="display:none">
                <i class="fa-brands fa-whatsapp"></i>
                </a>
            </div>
            <div class="col-md-6">
                <strong>Email:</strong>
                <span id="fichaEmail"></span>
                <a id="fichaMailto" href="#" class="btn btn-dark btn-xs ms-1" title="Enviar mail" style="display:none">
                <i class="fa-solid fa-envelope"></i>
                </a>
            </div>
            <div class="col-md-6">
                <strong>Negocio:</strong> <span id="fichaNegocio"></span>
            </div>
            <div class="col-md-6">
                <strong>CUIT:</strong> <span id="fichaCuit"></span>
            </div>
            <div class="col-12">
                <strong>Dirección:</strong>
                <span id="fichaDireccion"></span>
                <a id="fichaMaps" href="#" target="_blank" class="btn btn-dark btn-xs ms-1" title="Ver en Maps" style="display:none">
                <i class="fa-solid fa-location-dot"></i>
                </a>
            </div>
            </div>
        </div>

        <!-- Pedidos activos -->
        <h6 class="fw-bold mb-2 mt-3">Pedidos en curso</h5>
        <div class="table-responsive mb-4">
          <table class="table table-sm table-hover" id="tablaFichaPedidosActivos">
            <thead><tr><th>N°</th><th>Descripción</th><th>Estado</th><th>Entrega</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Últimos pedidos finalizados -->
        <h6 class="fw-bold mb-2 mt-3">Últimos pedidos finalizados</h5>
        <div class="table-responsive mb-4">
          <table class="table table-sm table-hover" id="tablaFichaPedidosFinalizados">
            <thead><tr><th>N°</th><th>Descripción</th><th>Entrega</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Presupuestos sin convertir -->
        <h6 class="fw-bold mb-2 mt-3">Presupuestos sin convertir en pedido</h5>
        <div class="table-responsive">
          <table class="table table-sm table-hover" id="tablaFichaPresupuestos">
            <thead><tr><th>N°</th><th>Total</th><th>Fecha</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-dark btn-xs btn-fuente" data-bs-dismiss="modal">Cerrar</button>
      </div>

    </div>
  </div>
</div>
