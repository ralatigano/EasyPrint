<!-- ------------------------------------------------------------------------------Modales categorias------------------------------------------------------------------------------ -->

<!-- Modal Editar Categoria -->
<div class="modal fade" id="editarCategoriaModal" tabindex="-1" aria-labelledby="editarCategoriaModalLabel" data-bs-backdrop="static" aria-hidden="true">   
    <form action="/productos/guardarCategoria/" method="POST">
        {% csrf_token %}
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="editarClienteModal">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input id="id" name="id" hidden>

                    <label for="nombre" style="font-weight: bold">Nombre:</label>
                    <input id="nombre" name="nombre" required>
                
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark btn-xs btn-fuente" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-dark btn-xs btn-fuente">Guardar</a></button> 
                </div>
            </div>
        </div>
    </form>
</div>

<!-- ------------------------------------------------------------------------------Modales insumos------------------------------------------------------------------------------ -->
<div class="modal fade" id="crearEditarInsumoModal" tabindex="-1" aria-labelledby="crearEditarInsumoModalLabel" data-bs-backdrop="static" aria-hidden="true">
    <form action="/productos/guardarInsumo/" method="POST">
        {% csrf_token %}
        <input type="hidden" name="id_insumo" id="id_insumo" value="0">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="crearEditarInsumoModalLabel">Nuevo insumo</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                
                <div class="modal-body">
                    <label for="nombre" class="fw-bold">Nombre:</label>
                    <input type="text" id="nombre_insumo" name="nombre" required class="form-control">
                    
                    <label for="unidad_medida" class="fw-bold">Unidad de compra:</label>
                    <input type="text" id="unidad_medida" name="unidad_medida" class="form-control"
                    title="Ej: paquete, rollo, frasco. Unidad en la que se adquiere el insumo">
                    
                    <label for="unidad_composicion" class="fw-bold">Unidad de uso:</label>
                    <input type="text" id="unidad_composicion" name="unidad_composicion" class="form-control"
                    title="Ej: cm², unidades, ml. Unidad con la que se consume o compone el producto">
                    
                    <label for="factor_conversion" class="fw-bold">Factor de conversión:</label>
                    <input type="number" id="factor_conversion" name="factor_conversion" class="form-control" min="1" step="1" value="1"
                    title="Cantidad de unidades de uso por cada unidad de compra. Ej: 1 rollo = 1000 cm² → factor 1000">
                    
                    <label for="stock_real" class="fw-bold">Stock real:</label>
                    <input type="number" id="stock_real" name="stock_real" step="0.01" min="0" class="form-control"
                    title="Cantidad disponible contada en unidades de uso (ej: hojas, cm², ml). La app calcula internamente el stock en unidades de compra.">
                    <small id="ayuda_stock_real" class="text-muted d-block mb-2"></small>

                    <label for="precio_unitario" class="fw-bold d-block">Precio:</label>
                    <input type="text" id="precio_unitario" name="precio_unitario" class="form-control"
                    title="Costo por cada unidad de medida. Ej: precio de la resma o de una caja del insumo">
                    
                    <label for="activo" class="fw-bold">Activo:</label>
                    <div class="form-check" title="Determina si el insumo está habilitado para ser usado en composiciones o pedidos">
                        <input class="form-check-input" type="checkbox" id="activo" name="activo" checked>
                        <label class="form-check-label" for="activo">Sí</label>
                    </div>
                </div>
                <div id="info-modificacion" class="text-muted small mt-3"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark btn-fuente" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-dark btn-fuente">Guardar</button>
                </div>
            </div>
        </div>
    </form>
</div>

<!-- ------------------------------------------------------------------------------Modales productos------------------------------------------------------------------------------ -->
<div class="modal fade" id="crearProductoModal" tabindex="-1" aria-labelledby="crearProductoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="crearProductoModalLabel">Nuevo producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                {% csrf_token %}
                <input type="hidden" name="id_producto" value="0">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="productoNombre" name="productoNombre" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select id="productoCategoria" name="productoCategoria" class="form-select">
                        <!-- Opciones dinámicas -->
                    </select>
                </div>
                <div class="row mb-2">
                    <div class="col">
                        <label for="productoAncho" class="form-label">Ancho (cm)</label>
                        <input type="number" step="0.01" class="form-control" id="productoAncho" name="productoAncho"
                            title="Para productos por unidad, usar ancho=1 y alto=1. Si se comercializa por m² o fracción, indicar dimensiones reales.">
                    </div>
                    <div class="col">
                        <label for="productoAlto" class="form-label">Alto (cm)</label>
                        <input type="number" step="0.01" class="form-control" id="productoAlto" name="productoAlto"
                            title="Para productos por unidad, usar ancho=1 y alto=1. Si se comercializa por m² o fracción, indicar dimensiones reales.">
                    </div>
                </div>

                <!-- ❓ Checkbox para tercerización -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="tercerizado-checkbox"  name="tercerizado" onchange="toggleInsumos(this.checked)" checked>
                    <label class="form-check-label" for="tercerizado-checkbox">Producto tercerizado</label>
                </div>
                <div class="mb-2" id="precioProveedorWrapper">
                    <label for="productoPrecioProveedor" class="form-label">Precio de proveedor</label>
                    <input type="text" class="form-control" id="productoPrecioProveedor" name="productoPrecioProveedor"
                            title="Precio fijo que nos cobra el proveedor por unidad. Solo se usa si el producto es tercerizado.">
                </div>

                <!-- 🔩 Sección de insumos -->
                <div id="seccion-insumos" style="display: none;">
                    <h6>Insumos del producto</h6>
                    <div id="insumos-container" class="d-flex flex-column gap-2"></div>
                    <button type="button" class="btn btn-outline-primary mt-2" onclick="agregarFilaInsumo()">➕ Agregar insumo</button>
                </div>
                <div class="mb-2">
                    <label for="productoMargen" class="form-label">Margen de rentabilidad</label>
                    <input type="text" step="0.01" class="form-control" id="productoMargen" name="productoMargen" value="1"
                            title="Multiplica el costo base (por insumos o proveedor) para obtener el precio final del producto. Ej: 1.3 → 30% margen">
                </div>

                <!-- 📊 Resumen de costos -->
                <div id="resumen-costos" class="mt-4">
                    <p><strong>Costo total insumos:</strong> <span id="costo-total" name="costo-total">$0.00</span></p>
                    <p><strong>Costo final (con factor):</strong> <span id="costo-final">$0.00</span></p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" onclick="guardarProducto()">Guardar producto</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Importando -->
<div class="modal fade" id="modalImportando" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content text-center p-4">
    <div class="modal-body">
        <div class="mb-3">
        <strong>Importando, por favor esperá...</strong>
        </div>
        <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-dark"
            role="progressbar" style="width: 100%"></div>
        </div>
    </div>
    </div>
</div>
</div>
